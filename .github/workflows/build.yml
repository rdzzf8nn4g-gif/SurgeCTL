name: Build SurgeCTL (All Jailbreaks)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # 允许手动在网页端点击触发

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          brew install ldid dpkg xz

      - name: Setup Theos (Roothide Fork)
        uses: actions/checkout@v4
        with:
          # 【核心修改】：使用 Roothide 官方的 Theos 分支，自带 roothide scheme
          repository: roothide/theos
          path: theos
          submodules: recursive

      - name: Setup iOS SDK
        run: |
          rm -rf theos/sdks
          git clone https://github.com/theos/sdks.git theos/sdks

      - name: Build All Schemes (Rootful, Rootless, Roothide)
        run: |
          export THEOS=${{ github.workspace }}/theos
          
          echo ">>> 正在修复维护者脚本换行符与权限 (防止静默失效)..."
          if [ -f postinst ]; then perl -pi -e 's/\r$//' postinst 2>/dev/null || true; chmod 0755 postinst 2>/dev/null || true; fi
          if [ -f postrm ]; then perl -pi -e 's/\r$//' postrm 2>/dev/null || true; chmod 0755 postrm 2>/dev/null || true; fi

          echo ">>> 清理旧文件..."
          make clean

          echo ">>> 正在编译 Rootful (有根) 版本..."
          make package

          echo ">>> 正在编译 Rootless (无根) 版本..."
          make package THEOS_PACKAGE_SCHEME=rootless

          echo ">>> 正在编译 Roothide (隐藏越狱) 版本..."
          make package THEOS_PACKAGE_SCHEME=roothide

          echo ">>> 编译完成！所有版本已生成。"

      - name: Upload DEB Packages
        uses: actions/upload-artifact@v4
        with:
          name: SurgeCTL-All-Jailbreaks
          path: packages/*.deb
